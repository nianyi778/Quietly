name: Release Build + Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Read version
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(xcodebuild -project Quietly.xcodeproj -scheme Quietly -configuration Release -destination 'platform=macOS,arch=arm64' -showBuildSettings)

          VERSION=$(echo "$SETTINGS" | sed -n 's/^[[:space:]]*MARKETING_VERSION = //p' | head -n 1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "MARKETING_VERSION not found. Available version-related settings:" >&2
            echo "$SETTINGS" | grep -E '^[[:space:]]*(MARKETING_VERSION|CURRENT_PROJECT_VERSION) = ' || true
            exit 1
          fi

          TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build Release (${{ matrix.arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, no codesign)
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project Quietly.xcodeproj \
            -scheme Quietly \
            -configuration Release \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="./build/Build/Products/Release/Quietly.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Release app not found at $APP_PATH" >&2
            exit 1
          fi

          mkdir -p dist
          OUT="dist/Quietly-${{ needs.meta.outputs.tag }}-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"
          ls -lh "$OUT"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="./build/Build/Products/Release/Quietly.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Release app not found at $APP_PATH" >&2
            exit 1
          fi

          TAG="${{ needs.meta.outputs.tag }}"
          DMG_OUT="dist/Quietly-${TAG}-${{ matrix.arch }}.dmg"

          BG_SRC="./scripts/dmg/background.png"
          BG_NAME="background.png"

          create_plain_dmg() {
            rm -rf dmgroot
            mkdir -p dmgroot
            cp -R "$APP_PATH" dmgroot/
            ln -s /Applications dmgroot/Applications

            hdiutil create \
              -volname "Quietly" \
              -srcfolder dmgroot \
              -ov \
              -format UDZO \
              "$DMG_OUT"
          }

          create_styled_dmg() {
            if [ ! -f "$BG_SRC" ]; then
              echo "Background image not found at $BG_SRC" >&2
              return 2
            fi

            rm -rf dmgroot
            mkdir -p dmgroot/.background
            cp -R "$APP_PATH" dmgroot/
            ln -s /Applications dmgroot/Applications
            cp "$BG_SRC" "dmgroot/.background/$BG_NAME"

            RW_DMG="dist/Quietly-${TAG}-${{ matrix.arch }}-rw.dmg"

            rm -f "$RW_DMG"

            hdiutil create \
              -volname "Quietly" \
              -srcfolder dmgroot \
              -ov \
              -format UDRW \
              "$RW_DMG" >/dev/null

            # Mount without custom mountpoint so Finder can access it as "disk Quietly"
            ATTACH_OUT=$(hdiutil attach -readwrite -noverify -noautoopen "$RW_DMG")
            DEVICE=$(echo "$ATTACH_OUT" | awk '/Apple_APFS|Apple_HFS/{print $1; exit}')
            if [ -z "$DEVICE" ]; then
              echo "Failed to attach DMG" >&2
              return 3
            fi

            # Use a temp AppleScript file for robustness
            printf '%s\n' \
              'tell application "Finder"' \
              '  tell disk "Quietly"' \
              '    open' \
              '    delay 2' \
              '    set current view of container window to icon view' \
              '    set toolbar visible of container window to false' \
              '    set statusbar visible of container window to false' \
              '    set the bounds of container window to {200, 120, 740, 500}' \
              '    set viewOptions to the icon view options of container window' \
              '    set arrangement of viewOptions to not arranged' \
              '    set icon size of viewOptions to 100' \
              '    set background picture of viewOptions to file ".background:background.png"' \
              '    set position of item "Quietly.app" of container window to {120, 130}' \
              '    set position of item "Applications" of container window to {420, 130}' \
              '    close' \
              '    open' \
              '    update without registering applications' \
              '    delay 2' \
              '  end tell' \
              'end tell' > /tmp/dmg-style.applescript
            osascript /tmp/dmg-style.applescript || echo "AppleScript styling failed, continuing..."

            sync
            hdiutil detach "$DEVICE" -force >/dev/null

            rm -f "$DMG_OUT"
            hdiutil convert "$RW_DMG" \
              -format UDZO \
              -imagekey zlib-level=9 \
              -ov \
              -o "$DMG_OUT" >/dev/null

            rm -f "$RW_DMG"
            rm -rf dmgroot
          }

          set +e
          create_styled_dmg
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "⚠️  DMG styling failed (status=$STATUS). Falling back to plain DMG." >&2
            create_plain_dmg
          fi

          ls -lh "$DMG_OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quietly-${{ needs.meta.outputs.tag }}-${{ matrix.arch }}
          path: dist/*

  tag:
    name: Tag version (if missing)
    runs-on: ubuntu-latest
    needs:
      - meta
      - build
    outputs:
      tag_created: ${{ steps.tag.outputs.tag_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag if not exists
        id: tag
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Skipping."
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          echo "tag_created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub Release (DMG)
    runs-on: ubuntu-latest
    needs:
      - meta
      - build
      - tag
    if: needs.tag.outputs.tag_created == 'true'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Quietly-${{ needs.meta.outputs.tag }}-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release and upload DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
